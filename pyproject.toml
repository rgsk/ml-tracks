[project]
name = "pytorch-practice"
version = "0.1.0"
description = "From-scratch ML interview prep: LLM (llm/) and RL (rl/) tracks."
requires-python = ">=3.12"

# Direct dependencies only — declare INTENT here. uv resolves the full transitive
# tree (nvidia-*, jupyter internals, etc.) into uv.lock. Never hand-edit the lock.
dependencies = [
    "torch>=2.12",
    "numpy>=2.4",
    "matplotlib>=3.9",
    "gymnasium[classic-control]>=1.0",  # RL environments (CartPole, etc.)
    "ipykernel>=7.0",                   # Jupyter notebooks (.ipynb worksheets)
]

[dependency-groups]
dev = [
    "jupytext>=1.19.4",
    "nbconvert>=7.17.1",
]

[tool.jupytext]
# Keep paired-notebook headers clean: strip the format_version / jupytext_version
# fields (they churn on every jupytext upgrade) AND the filter line itself, so a
# `--sync` / `--to ipynb` leaves the `.py` header stable with no diff noise.
notebook_metadata_filter = "-jupytext.text_representation.jupytext_version,-jupytext.text_representation.format_version,-jupytext.notebook_metadata_filter"
